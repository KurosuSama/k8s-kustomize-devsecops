apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- ingress.yaml

namespace: staging
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1