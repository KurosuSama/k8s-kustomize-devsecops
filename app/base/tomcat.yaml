apiVersion: apps/v1
kind: Deployment
metadata:
  name: vprofile-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vprofile-app
  template:
    metadata:
      labels:
        app: vprofile-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      enableServiceLinks: false
      containers:
        - name: tomcat
          image: kurosusama/vprofilek:v1.0.1@sha256:54b9d9703bb34d76bbb1091726ce2d35e2e159cfa247e532f15fee39ee154342
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "mysql"
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: MEMCACHED_HOST
              value: "memcached"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: vprofile-secrets
                  key: db-user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: vprofile-secrets
                  key: db-pass
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: vprofile-secrets
                  key: mq-user
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: vprofile-secrets
                  key: mq-pass
          volumeMounts:
            - name: tomcat-temp
              mountPath: /usr/local/tomcat/temp
            - name: tomcat-work
              mountPath: /usr/local/tomcat/work
            - name: tomcat-logs
              mountPath: /usr/local/tomcat/logs
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: tomcat-temp
          emptyDir: {}
        - name: tomcat-work
          emptyDir: {}
        - name: tomcat-logs
          emptyDir: {}
        

            
---
apiVersion: v1
kind: Service
metadata:
  name: vprofile-app
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: vprofile-app
  type: ClusterIP
    