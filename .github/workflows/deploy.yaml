name: DevSecOps CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  deploy-staging:
    name: Deploy to staging
    needs: security-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Deploy to K8s
        env:
          KUBE_HOST: ${{ secrets.KUBE_HOST }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
        run: |
          echo "Deploying to staging namespace..."

          kubectl --server="$KUBE_HOST" \
                  --token="$KUBE_TOKEN" \
                  --insecure-skip-tls-verify=true \
                  apply -k app/overlays/staging

          echo "Waiting for pods to be ready..."
          kubectl --server="$KUBE_HOST" \
                  --token="$KUBE_TOKEN" \
                  --insecure-skip-tls-verify=true \
                  rollout status deployment/vprofile-app -n staging --timeout=5m
      
      - name: Verify staging health
        if: always()
        env:
          KUBE_HOST: ${{ secrets.KUBE_HOST }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
        run: |
          echo "=== Active Pods in Staging ==="
          kubectl --server="$KUBE_HOST" --token="$KUBE_TOKEN" --insecure-skip-tls-verify=true get pods -n staging

