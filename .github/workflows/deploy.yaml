name: DevSecOps CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  deploy-staging:
    name: Deploy to staging
    needs: security-scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Deploy to K8s
        env:
          KUBE_HOST: ${{ secrets.KUBE_HOST }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
          KUBE_CA: ${{secrets.KUBE_CA}}
        run: |
          echo "$KUBE_CA" | base64 -d > /tmp/ca.crt
          echo "Deploying to staging namespace..."

          kubectl apply -k app/overlays/staging \
                  --server="$KUBE_HOST" \
                  --token="$KUBE_TOKEN" \
                  --certificate-authority=/tmp/ca.crt
                  

          echo "Waiting for pods to be ready..."
          kubectl rollout status deployment/vprofile-app -n staging --timeout=5m \
                  --server="$KUBE_HOST" \
                  --token="$KUBE_TOKEN" \
                  --certificate-authority=/tmp/ca.crt
      
      - name: Verify staging health
        if: always()
        env:
          KUBE_HOST: ${{ secrets.KUBE_HOST }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
          KUBE_CA: ${{secrets.KUBE_CA}}
        run: |
          echo "$KUBE_CA" | base64 -d > /tmp/ca.crt
          echo "=== Active Pods in Staging ==="
          kubectl get pods -n staging \
                  --server="$KUBE_HOST" \
                  --token="$KUBE_TOKEN" \
                  --certificate-authority=/tmp/ca.crt
                  

