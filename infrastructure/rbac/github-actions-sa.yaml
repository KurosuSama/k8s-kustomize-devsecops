apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-ci-bot
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-ci-deployer
  namespace: staging
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "patch", "update"]
- apiGroups: [""]
  resources: ["services", "configmaps"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: 
  name: github-ci-deployer-binding
  namespace: staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-ci-deployer
subjects:
  - kind: ServiceAccount
    name: github-ci-bot
    namespace: default
---
apiVersion: v1
kind: Secret
metadata:
  name: github-ci-bot-token
  namespace: default
  annotations:
    kubernetes.io/service-account.name: "github-ci-bot"
type: kubernetes.io/service-account-token
